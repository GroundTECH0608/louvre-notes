<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="description" content="時間あったら見てみて〜"><meta property="og:title" content="ルーヴル展　簡単にまとめてみた"><meta property="og:description" content="時間あったら見てみて〜"><meta property="og:type" content="website"><meta property="og:image" content="https://groundtech0608.github.io/louvre-notes/images/ogp-banner.jpg"><meta property="og:image:width" content="1920"><meta property="og:image:height" content="1080"><meta name="twitter:card" content="summary_large_image">
<title>ルーヴル展　簡単にまとめてみた</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#222222;--sub:#6b6b6b;--line:#e3e3e3;--gold:#e0a100;--red:#c23b30}
@media (prefers-color-scheme:dark){:root{--bg:#120e0b;--card:#1e1612;--ink:#f0e8de;--sub:#aa9e92;--line:#34261d;--gold:#f2b400;--red:#ff8f84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:600px;margin:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.top{padding:calc(26px + env(safe-area-inset-top)) 16px 16px;text-align:center}
.ptags{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
.ptag{border:1.5px solid #bdbdbd;border-radius:6px;padding:1px 10px;font-size:.76rem;color:#555;font-weight:700}
.ptag.red{border-color:var(--red);color:var(--red)}
@media (prefers-color-scheme:dark){.ptag{border-color:#666;color:#bbb}}
h1{margin:0 0 6px;font-size:1.45rem;line-height:1.45}
.psub{margin:0 0 2px;color:var(--sub);font-weight:700;font-size:.95rem}
.pdate{margin:0;font-size:.88rem}
.lead{margin:18px 20px 0;color:var(--sub);font-size:.93rem;text-align:center}
a.card{display:block;margin:14px 16px 0;padding:18px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a.card b{display:block;font-size:1.05rem}
a.card span{display:block;color:var(--sub);font-size:.88rem;margin-top:2px}
a.card::after{content:"→";float:right;color:var(--gold);font-size:1.3rem;margin-top:-34px}
a.card.ext::after{content:"↗"}
</style>
</head>
<body>
<main>
<div class="top">
  <div class="ptags"><span class="ptag red">非公式まとめ</span></div>
  <h1>ルーヴル展　簡単にまとめてみた</h1>
  <p class="psub">ルーヴル美術館展　ルネサンス</p>
  <p class="pdate">2026年9月9日（水）〜12月13日（日）　国立新美術館</p>
</div>
<figure style="margin:0"><img src="images/ogp-banner.jpg" alt="ルーヴル美術館展 ルネサンス" width="1920" height="1080" style="display:block;width:100%;height:auto"><figcaption style="padding:4px 16px 0;font-size:.68rem;color:var(--sub);text-align:right">© GrandPalaisRmn (musée du Louvre) / Michel Urtado</figcaption></figure>
<p class="lead">時間あったら見てみて〜</p>
<a class="card" href="pre-visit.html"><b>簡単にまとめてみた</b><span>さっと流したら5分、しっかり読んだら15分くらいかな～</span></a>
<div id="day"></div>
<a class="card ext" href="https://www.nact.jp/exhibition_special/2026/louvre2026/" target="_blank" rel="noopener"><b>展覧会の公式ページ</b><span>会期・開館時間・チケット（国立新美術館）</span></a>
<p style="margin:28px 20px 0;color:var(--sub);font-size:.74rem;line-height:1.7">プレビュー画像：国立新美術館 展覧会公式サイトのバナー（© GrandPalaisRmn (musée du Louvre) / Michel Urtado）。</p>
</main>
<script>
(function(){
  var me = false;
  try { me = new URLSearchParams(location.search).has("me"); } catch(e) {}
  var a = document.createElement("a");
  a.className = "card";
  a.href = "on-the-day.html" + (me ? "?me" : "");
  a.innerHTML = "<b>この作品なに？</b><span>気になった作品があったら</span>";
  document.getElementById("day").appendChild(a);
})();
</script>
</body>
</html>
