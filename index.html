<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="description" content="時間あったら見てみて〜"><meta property="og:title" content="ルーヴル展　簡単にまとめてみた"><meta property="og:description" content="時間あったら見てみて〜"><meta property="og:type" content="website"><meta property="og:image" content="https://groundtech0608.github.io/louvre-materials/images/ogp-banner.jpg"><meta property="og:image:width" content="1920"><meta property="og:image:height" content="1080"><meta name="twitter:card" content="summary_large_image">
<title>ルーヴル展　簡単にまとめてみた</title>
<style>
:root{--bg:#f5efe6;--card:#fffdf9;--ink:#2b2420;--sub:#7b6f66;--line:#e6dccf;--gold:#b08a3e;--wine:#7b2d3a;--hero1:#4a1824;--hero2:#7b2d3a}
@media (prefers-color-scheme:dark){:root{--bg:#15110e;--card:#201a16;--ink:#f0e8de;--sub:#aa9e92;--line:#382f28;--gold:#d4b36a;--wine:#e0909e;--hero1:#2a0f16;--hero2:#5a2230}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:600px;margin:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fbf3e8;padding:calc(44px + env(safe-area-inset-top)) 20px 32px}
.hero p{margin:0;font-size:.78rem;letter-spacing:.14em;opacity:.8}
.hero h1{margin:6px 0 0;font:700 1.9rem/1.3 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;letter-spacing:.04em}
.hero hr{width:44px;height:2px;background:var(--gold);border:0;margin:14px 0 0}
.lead{margin:20px 20px 0;color:var(--sub);font-size:.93rem}
a.card{display:block;margin:14px 16px 0;padding:18px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;box-shadow:0 1px 2px #2b242014,0 8px 24px #2b24200f}
a.card b{display:block;font-size:1.1rem}
a.card span{display:block;color:var(--sub);font-size:.88rem;margin-top:2px}
a.card::after{content:"→";float:right;color:var(--gold);font-size:1.3rem;margin-top:-34px}
a.card.ext::after{content:"↗"}
</style>
</head>
<body>
<main>
<header class="hero"><p>LOUVRE ／ RENAISSANCE</p><h1>ルーヴル展<br>ルネサンス</h1><hr></header>
<figure style="margin:0"><img src="images/ogp-banner.jpg" alt="ルーヴル美術館展 ルネサンス" width="1920" height="1080" style="display:block;width:100%;height:auto"><figcaption style="padding:4px 16px 0;font-size:.68rem;color:var(--sub);text-align:right">© GrandPalaisRmn (musée du Louvre) / Michel Urtado</figcaption></figure>
<p class="lead">時間あったら見てみて〜</p>
<a class="card" href="pre-visit.html"><b>簡単にまとめてみた</b><span>5分ほどで読めます</span></a>
<div id="day"></div>
<a class="card ext" href="https://www.nact.jp/exhibition_special/2026/louvre2026/" target="_blank" rel="noopener"><b>展覧会の公式ページ</b><span>会期・開館時間・チケット（国立新美術館）</span></a>
<p style="margin:28px 20px 0;color:var(--sub);font-size:.74rem;line-height:1.7">プレビュー画像：国立新美術館 展覧会公式サイトのバナー（© GrandPalaisRmn (musée du Louvre) / Michel Urtado）。</p>
</main>
<script>
(function(){
  var me = false;
  try { me = new URLSearchParams(location.search).has("me"); } catch(e) {}
  var d = new Date(Date.now() + 9 * 3600 * 1000);
  var ymd = d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
  if (me || ymd >= 20261110) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = "on-the-day.html" + (me ? "?me" : "");
    a.innerHTML = "<b>当日メモ</b><span>会場でスマホで開く。56点の解説つき</span>";
    document.getElementById("day").appendChild(a);
  }
})();
</script>
</body>
</html>
